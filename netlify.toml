[build]
  command = "node scripts/verify-release-config.mjs && next build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"

[functions."notification-worker"]
  schedule = "*/2 * * * *"

# ponytail: customer-auth migration bootstrap endpoint. Idempotent; gated by
# MIGRATE_SECRET env var; safe to invoke multiple times. Triggered once after
# production deploy to apply supabase/migrations/20260811100000_customer_auth_and_chat.sql.
[[redirects]]
  from = "/api/admin/migrate-customer-auth"
  to = "/.netlify/functions/migrate-customer-auth"
  status = 200

# Security headers (matches next.config.mjs headers() for redundancy)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
